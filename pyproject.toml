[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-slop-kit"
version = "0.1.0"
description = "Detect and prevent slop in AI-generated code and documentation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Anti-Slop Kit Contributors"}
]
keywords = ["ai", "code-quality", "linting", "documentation", "fidelity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]
hermes = [
    "pydantic>=2.0.0",
]

[project.scripts]
aslint = "tools.aslint.cli:main"
anti-slop-check = "tools.aslint.cli:main"

[project.urls]
Homepage = "https://github.com/ameobius-ai/anti-slop-kit"
Repository = "https://github.com/ameobius-ai/anti-slop-kit"
Documentation = "https://github.com/ameobius-ai/anti-slop-kit#readme"
Issues = "https://github.com/ameobius-ai/anti-slop-kit/issues"

[tool.setuptools]
packages = ["tools", "tools.aslint", "evals", "harness", "hooks"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
