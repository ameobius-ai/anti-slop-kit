name: 'Close stale issues and PRs'
on:
  schedule: [{cron: '30 1 * * *'}]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {issues: write, pull-requests: write}
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been automatically marked as stale.'
          stale-pr-message: 'This pull request has been automatically marked as stale.'
          close-issue-message: 'This issue was closed because it has been stale.'
          close-pr-message: 'This pull request was closed because it has been stale.'
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,enhancement,documentation'
          exempt-pr-labels: 'pinned,security,work-in-progress'
          operations-per-run: 100