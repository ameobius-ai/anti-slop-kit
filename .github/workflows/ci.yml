name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {python-version: ["3.9", "3.11", "3.13"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {cache: 'pip', cache-dependency-path: "pyproject.toml
requirements*.txt", python-version: "${{ matrix.python-version }}"}
      - name: Install dependencies
        run: |
          pip install -e '.[dev]' || pip install pytest || true
      - name: Run tests
        run: bash scripts/check.sh tests
  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install bandit
        run: pip install bandit || true
      - name: Run bandit
        run: |
          mkdir -p reports
          bandit -r tools/ evals/ hooks/ -f json -o reports/bandit-report.json || echo '{"results": []}' > reports/bandit-report.json
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with: {name: security-report, path: reports/}
  self-lint:
    name: the clean samples must stay clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install package
        run: pip install -e . || true
      - name: Run lint checks
        run: |
          if [ -f scripts/check.sh ]; then
            bash scripts/check.sh lint
          else
            echo "No check.sh found, skipping"
          fi
