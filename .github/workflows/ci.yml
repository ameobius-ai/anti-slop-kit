name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test half of the gate
        run: bash scripts/check.sh tests
      
      - name: Run tests with coverage (optional)
        run: |
          pip install pytest-cov || true
          pytest tests/ --cov=tools --cov=evals --cov-report=xml --cov-report=html --cov-report=term-missing || true
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
          else
            echo "Coverage report not generated (this is OK)"
          fi
      
      - name: Upload coverage report (if exists)
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('coverage.xml') != ''
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  self-lint:
    name: the clean samples must stay clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run the lint half of the gate
        env:
          ANTI_SLOP_FORMAT: github
        run: bash scripts/check.sh lint
