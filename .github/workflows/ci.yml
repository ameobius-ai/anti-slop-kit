name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test half of the gate
        run: bash scripts/check.sh tests
      
      - name: Run tests with coverage (optional)
        run: |
          pip install pytest-cov || true
          pytest tests/ --cov=tools --cov=evals --cov-report=xml --cov-report=html --cov-report=term-missing || true
          if [ -f coverage.xml ]; then
            echo "Coverage report generated successfully"
          else
            echo "Coverage report not generated (this is OK)"
          fi
      
      - name: Upload coverage report (if exists)
        uses: actions/upload-artifact@v4
        if: hashFiles('coverage.xml')
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/


  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -e '.[dev]' || true
      - name: Run bandit security scan
        run: |
          mkdir -p reports
          if command -v bandit >/dev/null 2>&1; then
            bandit -r tools/ evals/ hooks/ -f json -o reports/bandit-report.json || echo '{"results": []}' > reports/bandit-report.json
            echo 'Bandit report generated'
          else
            echo '{"results": [], "errors": ["bandit not installed"]}' > reports/bandit-report.json
            echo 'Bandit not available, created empty report'
          fi
      - name: Run pip-audit
        run: |
          if command -v pip-audit >/dev/null 2>&1; then
            pip-audit --desc on || echo 'pip-audit completed with findings'
          else
            echo 'pip-audit not available'
          fi
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: reports/

  self-lint:
    name: the clean samples must stay clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run the lint half of the gate
        env:
          ANTI_SLOP_FORMAT: github
        run: bash scripts/check.sh lint
